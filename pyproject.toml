[project]
name = "pigeonater"
version = "0.1.0"
description = "LAN dashboard and detector for pigeon candidate events from a webcam."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4.0",
    "opencv-python-headless>=4.10.0",
    "ultralytics>=8.3.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "sounddevice>=0.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
