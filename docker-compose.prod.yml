services:
  pidgeonater:
    image: "${PIDGEONATER_IMAGE:-ghcr.io/thibaultmarrannes/pigeonater:latest}"
    container_name: pidgeonater
    restart: unless-stopped
    ports:
      - "8080:8080"
    device_cgroup_rules:
      - "c 81:* rmw"
    environment:
      DATA_DIR: "/data"
      SNAPSHOT_DIR: "/data/snapshots"
      DATABASE_PATH: "/data/pidgeonater.sqlite3"
      MODEL_NAME: "${MODEL_NAME:-yolo11n.pt}"
      ACTION_WEBHOOK_URL: "${ACTION_WEBHOOK_URL:-}"
    volumes:
      - ./data:/data
      - /dev:/dev
