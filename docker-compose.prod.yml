name: pigeonater

services:
  pigeonater:
    image: "${PIGEONATER_IMAGE:-ghcr.io/thibaultmarrannes/pigeonater:latest}"
    container_name: pigeonater
    restart: unless-stopped
    devices:
      - /dev/snd:/dev/snd
    ports:
      - "8080:8080"
    device_cgroup_rules:
      - "c 81:* rmw"
      - "c 116:* rmw"
    environment:
      DATA_DIR: "/data"
      SNAPSHOT_DIR: "/data/snapshots"
      DATABASE_PATH: "/data/pigeonater.sqlite3"
      MODEL_NAME: "${MODEL_NAME:-yolo11n.pt}"
      ACTION_WEBHOOK_URL: "${ACTION_WEBHOOK_URL:-}"
    volumes:
      - ./data:/data
      - /dev:/dev
