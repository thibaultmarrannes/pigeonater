{% extends "base.html" %}
{% block content %}
<section class="page-head">
  <div>
    <p class="eyebrow">Detector</p>
    <h1>Settings</h1>
  </div>
</section>
<section class="settings-layout">
  <form id="settings-form" class="settings-form">
    <label>
      <span>Detection enabled</span>
      <input type="checkbox" name="enabled">
    </label>
    <label>
      <span>Camera</span>
      <select name="camera_device"></select>
    </label>
    <label>
      <span>Confidence threshold</span>
      <input type="number" name="confidence_threshold" min="0.05" max="0.95" step="0.05">
    </label>
    <label>
      <span>Cooldown seconds</span>
      <input type="number" name="cooldown_seconds" min="1" max="3600" step="1">
    </label>
    <label>
      <span>Retention days</span>
      <input type="number" name="retention_days" min="1" max="365" step="1">
    </label>
    <button type="submit">Save settings</button>
    <p id="settings-message"></p>
  </form>

  <aside class="panel camera-preview">
    <div class="panel-head">
      <h2>Camera preview</h2>
      <button id="refresh-preview" class="secondary" type="button">Refresh</button>
    </div>
    <div class="preview-frame">
      <img id="camera-preview-image" alt="Selected camera preview">
      <p id="camera-preview-empty" class="empty">No preview loaded.</p>
    </div>
    <p id="camera-preview-message" class="error"></p>
  </aside>
</section>
{% endblock %}
{% block scripts %}
<script>window.Pigeonater.settingsPage();</script>
{% endblock %}
