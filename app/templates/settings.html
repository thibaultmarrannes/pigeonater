{% extends "base.html" %}
{% block content %}
<div id="settings-app" v-cloak>
  <section class="page-head">
    <div>
      <p class="eyebrow">Detector</p>
      <h1>Settings</h1>
    </div>
  </section>
  <section class="settings-layout">
    <form class="settings-form" @submit.prevent="saveSettings">
    <label>
      <span>Detection enabled</span>
      <input type="checkbox" v-model="form.enabled">
    </label>
    <label>
      <span>Camera</span>
      <select v-model="form.camera_device" @change="markPreviewStale">
        <option v-for="camera in cameras" :key="camera.path" :value="camera.path" v-text="cameraLabel(camera)"></option>
      </select>
    </label>
    <label>
      <span>Audio output</span>
      <select v-model="form.output_device">
        <option v-for="device in audioDevices" :key="device.id" :value="device.id" v-text="audioDeviceLabel(device)"></option>
      </select>
    </label>
    <label>
      <span>Play sound on detection</span>
      <input type="checkbox" v-model="form.sound_on_detection">
    </label>
    <label>
      <span>Confidence threshold</span>
      <input type="number" v-model.number="form.confidence_threshold" min="0.05" max="0.95" step="0.05">
    </label>
    <label>
      <span>Cooldown seconds</span>
      <input type="number" v-model.number="form.cooldown_seconds" min="1" max="3600" step="1">
    </label>
    <label>
      <span>Retention days</span>
      <input type="number" v-model.number="form.retention_days" min="1" max="365" step="1">
    </label>
    <button type="submit">Save settings</button>
    <p v-text="message"></p>
  </form>

  <aside class="panel camera-preview">
    <div class="panel-head">
      <h2>Camera preview</h2>
      <button class="secondary" type="button" @click="refreshPreview">Refresh</button>
    </div>
    <div class="preview-frame">
      <img v-if="previewUrl" :src="previewUrl" alt="Selected camera preview">
      <p v-else class="empty" v-text="previewEmpty"></p>
    </div>
    <p class="error" v-text="previewError"></p>
  </aside>

  <aside class="panel audio-test">
    <div class="panel-head">
      <h2>Audio test</h2>
      <button class="secondary" type="button" @click="playTestBeep">Play beep</button>
    </div>
    <p class="empty">Use this to verify the selected output device before enabling detection sounds later.</p>
    <p v-text="audioMessage"></p>
    <p class="error" v-text="audioError"></p>
  </aside>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script>window.Pigeonater.settingsPage();</script>
{% endblock %}
