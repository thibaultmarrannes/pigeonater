<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pigeonater</title>
    <link rel="stylesheet" href="/static/styles.css?v={{ version_info.version }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">Pigeonater</a>
      <nav>
        <a href="/">Dashboard</a>
        <a href="/live">Live</a>
        <a href="/events">Events</a>
        <a href="/settings">Settings</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="app-footer">
      <span>Version {{ version_info.version }}</span>
    </footer>
    <script src="/static/vendor/vue.global.prod.js?v={{ version_info.version }}"></script>
    <script src="/static/app.js?v={{ version_info.version }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
