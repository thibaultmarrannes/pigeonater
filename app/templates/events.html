{% extends "base.html" %}
{% block content %}
<div id="events-app" v-cloak>
  <section class="page-head">
    <div>
      <p class="eyebrow">Evidence</p>
      <h1>Detection events</h1>
    </div>
  </section>
  <div class="event-list wide">
    <article v-for="event in events" :key="event.id" class="event-item">
      <video v-if="event.video_url" controls preload="metadata" :poster="snapshotSrc(event)">
        <source :src="videoSrc(event)" type="video/mp4">
      </video>
      <a v-else :href="event.snapshot_url" target="_blank" rel="noreferrer">
        <img :src="snapshotSrc(event)" :alt="`Detection snapshot ${event.id}`">
      </a>
      <div class="event-details">
        <strong v-text="`${event.label} candidate`"></strong>
        <span v-text="formatDate(event.created_at)"></span>
        <span v-text="`${Math.round(event.confidence * 100)}% confidence`"></span>
        <small v-text="boxLabel(event)"></small>
        <button
          v-if="event.video_url"
          class="danger compact"
          type="button"
          :disabled="isDeletingVideo(event)"
          @click="deleteEventVideo(event)"
          v-text="isDeletingVideo(event) ? 'Deleting video...' : 'Delete video'"
        ></button>
      </div>
    </article>
    <p v-if="!events.length" class="empty">No detections recorded yet.</p>
  </div>
  <p class="error" v-text="error"></p>
</div>
{% endblock %}
{% block scripts %}
<script>window.Pigeonater.eventsPage();</script>
{% endblock %}
